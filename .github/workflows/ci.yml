name: CI
on:
  pull_request: { branches: [develop, main] }
  push: { branches: [develop, main] }
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: |
          if ls src/PetCop.Api/*.csproj >/dev/null 2>&1; then dotnet restore src/PetCop.Api && dotnet build src/PetCop.Api --no-restore && dotnet test --no-build || true; else echo "Aún sin proyecto .NET"; fi
